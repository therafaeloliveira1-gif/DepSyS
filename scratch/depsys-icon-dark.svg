<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="dark-bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#e60000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo Titanio Puro Zinc-950 -->
  <rect width="512" height="512" rx="108" fill="url(#dark-bg-glow)" stroke="#27272a" stroke-width="3"/>
  
  <!-- Símbolo Hexagonal Central -->
  <g filter="url(#red-glow)">
    <!-- Hexágono Exterior Rojo -->
    <polygon points="256.0,55 391.0,167.5 391.0,262.5 256.0,375 121.0,262.5 121.0,167.5" 
             fill="#121214" 
             stroke="#e60000" 
             stroke-width="20" 
             stroke-linejoin="round" 
             stroke-linecap="round" />

    <!-- Hexágono Interior Fino -->
    <polygon points="256.0,83 367.0,175.5 367.0,254.5 256.0,347 145.0,254.5 145.0,175.5" 
             fill="none" 
             stroke="rgba(255,255,255,0.18)" 
             stroke-width="3" 
             stroke-linejoin="round" 
             stroke-linecap="round" />

    <!-- Capa 1: Rombo Isométrico Superior -->
    <polygon points="256.0,135 320.0,167 256.0,199 192.0,167" 
             fill="none" 
             stroke="#ffffff" 
             stroke-width="18" 
             stroke-linejoin="round" 
             stroke-linecap="round" />

    <!-- Capa 2: Chevron Isométrico Intermedio -->
    <polyline points="192.0,203 256.0,235 320.0,203" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="18" 
              stroke-linejoin="round" 
              stroke-linecap="round" />

    <!-- Capa 3: Chevron Isométrico Inferior -->
    <polyline points="192.0,239 256.0,271 320.0,239" 
              fill="none" 
              stroke="#e60000" 
              stroke-width="18" 
              stroke-linejoin="round" 
              stroke-linecap="round" />
  </g>

  <!-- Tipografía Oficial DEPSYS -->
  <text x="256.0" y="445" 
        font-family="'Montserrat', 'Chakra Petch', 'Segoe UI', system-ui, sans-serif" 
        font-size="60" 
        font-weight="900" 
        letter-spacing="7" 
        fill="#ffffff" 
        text-anchor="middle">DEPSYS</text>
</svg>