<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;family=Montserrat:wght@700&amp;display=swap');
    </style>
    <linearGradient id="titanium-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo Carbón Titanio Oficial (Zinc-950) -->
  <rect width="1120" height="330" rx="28" fill="url(#titanium-bg)" stroke="#27272a" stroke-width="2" />

  <!-- SÍMBOLO EMBLEMA CONCÉNTRICO -->
  <g filter="url(#soft-glow)">
    <!-- Hexágono Exterior Fino Exterior -->
    <polygon points="200.00,28.00 314.32,94.00 314.32,236.00 200.00,302.00 85.68,236.00 85.68,94.00" 
             fill="none" 
             stroke="#ffffff" 
             stroke-width="8" 
             stroke-linejoin="round" 
             stroke-linecap="round" />

    <!-- Hexágono Fino Interior de Resonancia -->
    <polygon points="200.00,43.00 302.19,102.00 302.19,228.00 200.00,287.00 97.81,228.00 97.81,102.00" 
             fill="none" 
             stroke="rgba(255, 255, 255, 0.35)" 
             stroke-width="2.5" 
             stroke-linejoin="round" 
             stroke-linecap="round" />

    <!-- Hexágono Interior Sólido -->
    <polygon points="200.00,78.00 272.75,120.00 272.75,210.00 200.00,252.00 127.25,210.00 127.25,120.00" 
             fill="#18181b" 
             stroke="#ffffff" 
             stroke-width="14" 
             stroke-linejoin="round" 
             stroke-linecap="round" />

    <!-- Capas Isométricas dentro del núcleo -->
    <polygon points="200.00,115.00 242.00,137.00 200.00,159.00 158.00,137.00" 
             fill="none" 
             stroke="#ffffff" 
             stroke-width="12" 
             stroke-linejoin="round" 
             stroke-linecap="round" />

    <polyline points="158.00,161.00 200.00,183.00 242.00,161.00" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="12" 
              stroke-linejoin="round" 
              stroke-linecap="round" />

    <polyline points="158.00,185.00 200.00,207.00 242.00,185.00" 
              fill="none" 
              stroke="#e60000" 
              stroke-width="12" 
              stroke-linejoin="round" 
              stroke-linecap="round" />
  </g>

  <!-- TIPOGRAFÍA OFICIAL ORBITRON EXACTA DE LA REFERENCIA -->
  <text x="380" y="198" 
        font-family="'Orbitron', 'Chakra Petch', 'Montserrat', system-ui, sans-serif" 
        font-size="112" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#ffffff">DEPSYS</text>

  <!-- Subtítulo Institucional Motos Mendes -->
  <text x="385" y="248" 
        font-family="'Montserrat', system-ui, sans-serif" 
        font-size="15" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#a1a1aa">SISTEMA DE DEPÓSITO Y PICKING • MOTOS MENDES</text>

  <!-- Indicador Oficial -->
  <g transform="translate(940, 32)">
    <rect width="136" height="28" rx="14" fill="rgba(230,0,0,0.15)" stroke="#e60000" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4.5" fill="#e60000" />
    <text x="28" y="19" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.5" fill="#ffffff">INDUSTRIAL</text>
  </g>
</svg>