# ==============================================================================
# Servidor Apache 2.4 - DepSyS / Motos Mendes (Servidor Propio Blindado)
# ==============================================================================

ServerRoot "c:/Apache24"
Listen 80

# ------------------------------------------------------------------------------
# 1. Blindaje y Ocultamiento del Servidor (Anti-Reconocimiento y Anti-Exploits)
# ------------------------------------------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Módulos Básicos y Esenciales de Apache
LoadModule actions_module modules/mod_actions.so
LoadModule alias_module modules/mod_alias.so
LoadModule allowmethods_module modules/mod_allowmethods.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule isapi_module modules/mod_isapi.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so

# Integración Oficial con PHP 8.2 (C:/php)
LoadFile "c:/php/libcrypto-3-x64.dll"
LoadFile "c:/php/libssl-3-x64.dll"
LoadModule php_module "c:/php/php8apache2_4.dll"
AddHandler application/x-httpd-php .php
PHPIniDir "c:/php"

<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

ServerName depsys.test:80

# ------------------------------------------------------------------------------
# 2. Seguridad Global de Directorios (Denegar todo por defecto)
# ------------------------------------------------------------------------------
<Directory />
    AllowOverride none
    Require all denied
</Directory>

# Bloquear cualquier archivo oculto (.git, .env, .htaccess, etc.)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Bloquear descarga directa de código fuente, respaldos, scripts y configs sensibles
<FilesMatch "(?i)\.(env|sql|log|git|bat|ps1|vbs|yml|yaml|ini|sh|bak|config|db|fdb|md)$">
    Require all denied
</FilesMatch>

# ------------------------------------------------------------------------------
# 3. DocumentRoot Seguro (-Indexes: Prohibido listar carpetas)
# ------------------------------------------------------------------------------
DocumentRoot "c:/Apache24/htdocs"
<Directory "c:/Apache24/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.php index.html
</IfModule>

# Logs
ErrorLog "logs/error.log"
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog "logs/access.log" common
</IfModule>

# Tipos MIME
<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
    AddType application/x-httpd-php .php
</IfModule>

# ------------------------------------------------------------------------------
# 4. Cabeceras Globales de Seguridad HTTP
# ------------------------------------------------------------------------------
<IfModule headers_module>
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-XSS-Protection "1; mode=block"
    Header unset X-Powered-By
</IfModule>

# ==============================================================================
# ALIAS Y CONFIGURACIÓN PARA DEPSYS Y APIS DE MOTOS MENDES
# ==============================================================================
# Rutas oficiales protegidas
Alias /api/DepSyS_Api "c:/WorkSpace/motos-mendes-data/motos-mendes-api/api/DepSyS_Api"
Alias /api "c:/WorkSpace/motos-mendes-data/motos-mendes-api/api/DepSyS_Api"
Alias /apis "c:/WorkSpace/motos-mendes-data/motos-mendes-api/api"

<Directory "c:/WorkSpace/motos-mendes-data/motos-mendes-api/api">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    <IfModule headers_module>
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header unset X-Powered-By
    </IfModule>
</Directory>

<Directory "c:/WorkSpace/motos-mendes-data/motos-mendes-api/api/DepSyS_Api">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    <IfModule headers_module>
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header unset X-Powered-By
    </IfModule>
</Directory>
